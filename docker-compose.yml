networks:
  prod_net:
    name: chat-app-network

volumes:
  chat_app_pg_data:
    name: chat-app-pg-data
  chat_app_redis_data:
    name: chat-app-redis-data

services:
  chat_app_postgres:
    container_name: chat_app_postgres
    image: 'postgres:16-bookworm'
    environment:
      POSTGRES_USER: '${DATABASE_USERNAME}'
      POSTGRES_PASSWORD: '${DATABASE_PASSWORD}'
      POSTGRES_DB: '${DATABASE_NAME}'
    ports:
      - '5439:5432'
    restart: '${DOCKER_RESTART_POLICY:-unless-stopped}'
    stop_grace_period: '3s'
    volumes:
      - ../chat_app_pg_data:/var/lib/postgresql/data
      - ../data/postgres/initdb.d:/docker-entrypoint-initdb.d
    networks:
      - prod_net
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}']
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  chat_app_redis:
    container_name: chat_app_redis
    image: 'redis/redis-stack:latest'
    environment:
      REDIS_ARGS: '--save 60 1 --appendonly yes'
    ports:
      - '6379:6379'
      - '8001:8001'
    restart: '${DOCKER_RESTART_POLICY:-unless-stopped}'
    volumes:
      - chat_app_redis_data:/data
    networks:
      - prod_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5
      timeout: 10s

